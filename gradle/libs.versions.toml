[versions]
activityCompose = "1.9.2"
agp = "8.6.0"
compiler = "1.5.15"
kotlin = "1.9.25"
coreKtx = "1.13.1"
junit = "4.13.2"
junitVersion = "1.2.1"
espressoCore = "3.6.1"
